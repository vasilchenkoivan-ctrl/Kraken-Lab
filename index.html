<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>Kraken Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0b0b0d;
      --card: #17171b;
      --text: #f5f5f5;
      --muted: #96969e;
      --accent: #b8ff38;
      --border: #29292f;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 95px;
    }
    button, input {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    header {
      padding: 23px 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .logo span {
      color: var(--accent);
    }
    .badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 13px;
    }
    main {
      padding: 0 16px;
    }
    .hero {
      background: linear-gradient(135deg, #252b1c, #17171b 70%);
      border: 1px solid #383d2d;
      padding: 24px 20px;
      border-radius: 23px;
      margin: 10px 0 24px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: 31px;
      line-height: 1.08;
      letter-spacing: -1px;
      margin-bottom: 11px;
    }
    .hero p {
      color: #c1c1c6;
      font-size: 13px;
      line-height: 1.5;
    }
    .section-title {
      font-size: 19px;
      margin: 25px 0 14px;
      letter-spacing: -.4px;
    }
    .search {
      width: 100%;
      background: var(--card);
      color: white;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 15px;
      outline: none;
      margin-bottom: 16px;
    }
    .search:focus {
      border-color: var(--accent);
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .category {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--card);
      color: #ccc;
      border: 1px solid var(--border);
      font-size: 12px;
    }
    .category.active {
      color: #111;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 800;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .product {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      min-width: 0;
    }
    .product-image {
      height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #242429, #121214);
      font-size: 43px;
    }
    .product-info {
      padding: 12px;
    }
    .product-category {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 7px;
    }
    .product h3 {
      font-size: 13px;
      line-height: 1.4;
      min-height: 36px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }
    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .price {
      font-weight: 800;
      font-size: 15px;
    }
    .add {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #111;
      font-size: 23px;
      font-weight: 700;
    }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 25px 0;
      grid-column: 1 / -1;
      text-align: center;
    }
    .bottom-nav {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: rgba(15, 15, 18, .97);
      border-top: 1px solid var(--border);
      padding: 12px 5px calc(12px + env(safe-area-inset-bottom));
    }
    .nav-item {
      color: var(--muted);
      background: none;
      border: none;
      font-size: 11px;
      min-width: 65px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .nav-item span {
      font-size: 21px;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .cart-count {
      color: var(--accent);
      font-weight: 800;
    }
    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">KRAKEN<span> LAB</span></div>
    <div class="badge">Магазин</div>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow">KRAKEN LAB</div>
      <h1>Твой магазин.<br>Всё в одном месте.</h1>
      <p>Каталог, поиск и удобная корзина — в одном приложении.</p>
    </section>
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Поиск по каталогу..."
      autocomplete="off"
    >
    <h2 class="section-title">Категории</h2>
    <div class="categories" id="categories"></div>
    <h2 class="section-title" id="products-title">Все товары</h2>
    <div class="products" id="products"></div>
    <p class="notice">
      Демоверсия интерфейса. Оформление заказов и хранение данных
      подключим на следующих этапах.
    </p>
  </main>
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home">
      <span>⌂</span>Главная
    </button>
    <button class="nav-item" data-page="catalog">
      <span>▦</span>Каталог
    </button>
    <button class="nav-item" data-page="cart">
      <span>🛒</span>Корзина <b class="cart-count" id="cart-count">0</b>
    </button>
    <button class="nav-item" data-page="profile">
      <span>♙</span>Профиль
    </button>
  </nav>
  <script>
    const categories = [
      "Все товары",
      "Жидкости",
      "Картриджи",
      "Устройства",
      "Аксессуары"
    ];
    // Пока это демонстрационные товары.
    // Позже заменим их товарами из базы данных.
    const products = [
      const SUPABASE_URL = "https://osmeveovehxgktmprmsh.supabase.co";
const SUPABASE_KEY = "ВСТАВЬ_СЮДА_СВОЙ_sb_publishable_КЛЮЧ";

async function loadProducts() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=*`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      console.error("Ошибка Supabase:", await response.text());
      return;
    }

    const data = await response.json();

    if (data.length > 0) {
      products.splice(0, products.length, ...data.map(item => ({
        id: item.id,
        name: item.name,
        category: item.category || "Все товары",
        price: Number(item.price),
        image: item.image || "📦"
      })));

      renderProducts();
    }
  } catch (error) {
    console.error("Ошибка подключения:", error);
  }
}
      {
        id: 1,
        name: "Пример товара №1",
        category: "Жидкости",
        price: 350,
        image: "💧"
      },
      {
        id: 2,
        name: "Пример товара №2",
        category: "Картриджи",
        price: 250,
        image: "📦"
      },
      {
        id: 3,
        name: "Пример товара №3",
        category: "Устройства",
        price: 850,
        image: "⚡"
      },
      {
        id: 4,
        name: "Пример товара №4",
        category: "Аксессуары",
        price: 150,
        image: "🔌"
      }
    ];
    let activeCategory = "Все товары";
    let cart = {};
    const productsElement = document.getElementById("products");
    const categoriesElement = document.getElementById("categories");
    const searchElement = document.getElementById("search");
    function renderCategories() {
      categoriesElement.innerHTML = categories.map(category => `
        <button
          class="category ${category === activeCategory ? "active" : ""}"
          data-category="${category}"
        >${category}</button>
      `).join("");
      categoriesElement.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          renderCategories();
          renderProducts();
        });
      });
    }
    function renderProducts() {
      const query = searchElement.value.trim().toLowerCase();
      const filtered = products.filter(product => {
        const matchesCategory =
          activeCategory === "Все товары" ||
          product.category === activeCategory;
        const matchesSearch =
          product.name.toLowerCase().includes(query) ||
          product.category.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });
      if (!filtered.length) {
        productsElement.innerHTML =
          '<div class="empty">Ничего не найдено</div>';
        return;
      }
      productsElement.innerHTML = filtered.map(product => `
        <article class="product">
          <div class="product-image">${product.image}</div>
          <div class="product-info">
            <div class="product-category">${product.category}</div>
            <h3>${product.name}</h3>
            <div class="product-bottom">
              <div class="price">${product.price} ₴</div>
              <button class="add" data-add="${product.id}" aria-label="Добавить в корзину">+</button>
            </div>
          </div>
        </article>
      `).join("");
      productsElement.querySelectorAll("[data-add]").forEach(button => {
        button.addEventListener("click", () => {
          const id = Number(button.dataset.add);
          cart[id] = (cart[id] || 0) + 1;
          updateCartCount();
          button.textContent = "✓";
          setTimeout(() => {
            if (button.isConnected) button.textContent = "+";
          }, 700);
        });
      });
    }
    function updateCartCount() {
      const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      document.getElementById("cart-count").textContent = count;
    }
    searchElement.addEventListener("input", renderProducts);
    document.querySelectorAll(".nav-item").forEach(button => {
      button.addEventListener("click", () => {
        const page = button.dataset.page;
        document.querySelectorAll(".nav-item").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        if (page === "home" || page === "catalog") {
          activeCategory = "Все товары";
          renderCategories();
          renderProducts();
          document.getElementById("products-title").textContent =
            page === "home" ? "Все товары" : "Каталог";
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (page === "cart") {
          alert("Корзину подключим на следующем этапе.");
        } else if (page === "profile") {
          alert("Профиль и история заказов появятся после подключения базы данных.");
        }
      });
    });

    const data = await response.json();

    products.length = 0;

    data.forEach(item => {
      products.push({
        id: item.id,
        name: item.name,
        category: item.category || "Все товары",
        price: Number(item.price),
        image: item.image || "📦"
      });
    });

    renderCategories();
    renderProducts();
  } catch (error) {
    console.error("Ошибка Supabase:", error);
    renderCategories();
    renderProducts();
  }
}

loadProducts();
  </script>
</body>
</html>
