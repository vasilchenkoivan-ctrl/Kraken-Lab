<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Lab 🐙</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #00ffcc;
            --secondary-text: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .product-price {
            color: var(--accent-color);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 16px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.8;
        }
        /* Фиксированная панель корзины внизу */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e1e1e;
            padding: 16px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-total {
            font-size: 16px;
            font-weight: bold;
        }
        .checkout-btn {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🐙 Kraken Lab Shop</h1>

    <div class="products-grid" id="products-container">
        <!-- Товары будут подгружаться сюда -->
        <div class="product-card">
            <div class="product-title">Chaser For Pods (Набір)</div>
            <div class="product-price">350 грн</div>
            <button class="btn" onclick="addToCart('Chaser For Pods', 350)">Додати в кошик</button>
        </div>
        <div class="product-card">
            <div class="product-title>Гліцерин USP</div>
            <div class="product-price">150 грн</div>
            <button class="btn" onclick="addToCart('Гліцерин USP', 150)">Додати в кошик</button>
        </div>
    </div>

    <!-- Панель корзины -->
    <div class="cart-bar">
        <div class="cart-total" id="cart-total">Обрано: 0 грн</div>
        <button class="checkout-btn" onclick="checkoutOrder()">Оформити замовлення</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartTotal();
            tg.HapticFeedback.impactOccurred('medium'); // Легкая вибрация при добавлении
        }

        function updateCartTotal() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `Сума: ${total} грн`;
        }

        function checkoutOrder() {
            if (cart.length === 0) {
                alert("Ваш кошик порожній!");
                return;
            }

            let orderText = "🛒 **Нове замовлення з Kraken Lab!**\n\n";
            let total = 0;
            
            cart.forEach((item, index) => {
                orderText += `${index + 1}. ${item.name} — ${item.price} грн\n`;
                total += item.price;
            });

            orderText += `\n💰 **Загальна сума:** ${total} грн\n`;
            orderText += `👤 **Клієнт:** ${tg.initDataUnsafe?.user?.first_name || 'Гість'}`;

            // Отправляем данные в бота
            if (tg && tg.sendData) {
                tg.sendData(orderText);
            } else {
                alert("Замовлення сформовано! (Відкрийте через Telegram-бота)");
            }
        }
    </script>

</body>
</html>
