<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Lab — Магазин</title>
    <!-- Подключаем Tailwind CSS для дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-white min-h-screen pb-24">

    <div class="p-4 max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-center mb-4">🐙 Kraken Lab 🧪</h1>
        
        <!-- Контейнер куда будут подгружаться товары из базы -->
        <div id="products-container" class="space-y-4">
            <p class="text-center text-gray-400">Завантаження каталогу...</p>
        </div>

        <!-- Информационный блок (Соцсети, Оплата, Оферта) -->
        <div class="p-4 bg-[#121926] rounded-2xl space-y-4 border border-gray-800 mt-8">
            <div>
                <p class="text-xs text-gray-400 mb-2 font-medium">Соціальні мережі:</p>
                <a href="https://t.me/KRAKENOTZYVY" target="_blank" class="w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center text-white text-sm">
                    ✈️
                </a>
            </div>

            <div>
                <p class="text-xs text-gray-400 mb-2 font-medium">Оплата:</p>
                <div class="flex gap-2">
                    <span class="px-2.5 py-1 bg-white text-black rounded text-[10px] font-bold">VISA</span>
                    <span class="px-2.5 py-1 bg-white text-black rounded text-[10px] font-bold">Mastercard</span>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="alert('Розділ оплати')" class="px-3 py-1.5 bg-gray-800 rounded-xl text-xs text-gray-300">Оплата</button>
                <button onclick="alert('Розділ доставки')" class="px-3 py-1.5 bg-gray-800 rounded-xl text-xs text-gray-300">Доставка</button>
                <button onclick="alert('Публічна оферта')" class="px-3 py-1.5 bg-gray-800 rounded-xl text-xs text-gray-300">Оферта</button>
            </div>

            <div>
                <button onclick="alert('Політика конфіденційності')" class="w-full py-2 bg-gray-800 rounded-xl text-xs text-gray-300">
                    Політика конфіденційності
                </button>
            </div>
        </div>
    </div>

    <script>
        // Твои ключи Supabase (они публичные и безопасные для фронтенда)
        const SUPABASE_URL = 'https://ovhuzqfchqngytfysiln.supabase.co
'; // Замени на свой URL если нужно, или подтянется из окружения
        const SUPABASE_ANON_KEY = 'sb_publishable_yKf0fucUXBU8M59ws2U5Zg_21ddos8i';

        // Инициализация Supabase
        const { createClient } = supabase;
        const _supabase = createClient(
            window.SUPABASE_URL || "https://ovhuzqfch...supabase.co", // Твой URL из Vercel/Supabase
            window.SUPABASE_KEY || "eyJhbG..." // Твой ключ
        );

        // Функция отрисовки товаров
        async function fetchAndRenderProducts() {
            const container = document.getElementById('products-container');
            
            // Запрос к таблице products
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500 text-center">Помилка завантаження: ${error.message}</p>`;
                return;
            }

            if (!products || products.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400">Товарів поки немає. Додайте їх через бота!</p>`;
                return;
            }

            container.innerHTML = '';

            products.forEach(product => {
                const title = product.title || product.name || 'Товар';
                const price = product.price || 0;
                const oldPrice = product.old_price ? `<span class="line-through text-gray-500 text-xs mr-2">${product.old_price} грн</span>` : '';
                const image = product.image ? `<img src="${product.image}" class="w-full h-48 object-cover rounded-xl mb-3" alt="${title}">` : '';
                const description = product.description ? `<p class="text-sm text-gray-400 mt-1">${product.description}</p>` : '';

                // Обработка вкусов (если они есть)
                let flavors = [];
                try {
                    flavors = typeof product.flavors === 'string' ? JSON.parse(product.flavors) : (product.flavors || []);
                } catch (e) {
                    flavors = [];
                }

                let flavorsHtml = '';
                if (flavors.length > 0) {
                    flavorsHtml = `
                        <div class="mt-3">
                            <p class="text-xs text-gray-400 mb-2 font-medium">Смаки</p>
                            <div class="flex flex-wrap gap-2">
                                ${flavors.map((flavor, idx) => `
                                    <button onclick="selectFlavor(this, '${product.id}', '${flavor}')" 
                                        class="flavor-btn-${product.id} px-3 py-1.5 rounded-xl text-xs font-medium transition-all${idx === 0 ? 'bg-blue-600 text-white border border-blue-400' : 'bg-gray-800 text-gray-300 border border-gray-700'}">
                                        ${flavor}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // Карточка товара
                const card = document.createElement('div');
                card.className = "bg-[#121926] p-4 rounded-2xl border border-gray-800";
                card.innerHTML = `
                    ${image}
                    <h3 class="text-xl font-bold">${title}</h3>
                    ${description}
                    ${flavorsHtml}
                    <div class="flex items-center justify-between mt-4 pt-2 border-t border-gray-800/50">
                        <div>
                            ${oldPrice}
                            <span class="text-xl font-bold text-red-500">${price} грн</span>
                        </div>
                        <button onclick="addToCart('${title}')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-semibold">
                            В кошик
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectFlavor(btn, productId, flavor) {
            // Переключение активной кнопки вкуса
            const buttons = document.querySelectorAll(`.flavor-btn-${productId}`);
            buttons.forEach(b => {
                b.className = b.className.replace('bg-blue-600 text-white border border-blue-400', 'bg-gray-800 text-gray-300 border border-gray-700');
            });
            btn.className = "px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-blue-600 text-white border border-blue-400";
        }

        function addToCart(title) {
            alert(`Товар "${title}" додано до кошика!`);
        }

        // Запускаем загрузку при открытии страницы
        fetchAndRenderProducts();
    </script>
</body>
</html>
