<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Lab</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent: #22c55e;
            --text-color: #ffffff;
            --text-secondary: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #262930;
        }
        .container {
            padding: 16px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #262930;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #161920;
            border-top: 1px solid #262930;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>🐙 KRAKEN LAB</header>

    <div class="container">
        <!-- Вкладка: Головна -->
        <div id="tab-main" class="tab-content active">
            <div class="card">
                <h3>🎁 Реферальне посилання</h3>
                <p style="color: var(--text-secondary); font-size: 14px;">Запрошуйте друзів та отримуйте бонуси!</p>
                <input type="text" id="refLink" readonly style="font-size: 12px;" />
                <button class="btn" onclick="copyRef()">Копіювати посилання</button>
            </div>
        </div>

        <!-- Вкладка: Каталог -->
        <div id="tab-catalog" class="tab-content">
            <h2>Каталог товарів</h2>
            <div class="card">
                <h3>Chaser 30ml (Виноград)</h3>
                <p>Ціна: 300 ₴</p>
                <button class="btn" onclick="addToCart('Chaser 30ml', 'Виноград', 300)">Додати в кошик</button>
            </div>
        </div>

        <!-- Вкладка: Кошик -->
        <div id="tab-cart" class="tab-content">
            <h2>Ваш кошик</h2>
            <div id="cartItems">Кошик порожній</div>
            
            <div class="card" style="margin-top: 20px;">
                <h3>Оформлення замовлення</h3>
                <label>Спосіб доставки:</label>
                <select id="deliveryMethod">
                    <option value="Нова Пошта">Нова Пошта</option>
                    <option value="Самовивіз">Самовивіз</option>
                </select>

                <label>Телефон:</label>
                <input type="tel" id="phone" placeholder="+380..." value="+380" />

                <label>Деталі (Місто / Відділення / Коментар):</label>
                <input type="text" id="address" placeholder="Київ, відд. №1" />

                <h3>До сплати: <span id="totalPrice">0</span> ₴</h3>
                <button class="btn" onclick="checkout()">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
            </div>
        </div>
    </div>

    <!-- Нижня панель навігації -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('main')">🏠 Головна</button>
        <button class="nav-item" onclick="switchTab('catalog')">📦 Каталог</button>
        <button class="nav-item" onclick="switchTab('cart')">🛒 Кошик</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];
        const user = tg.initDataUnsafe?.user || { id: '1005867951', first_name: 'Vanyok', username: 'Telleportt' };

        // Реферальная ссылка
        document.getElementById('refLink').value = `https://t.me/KrakenLabBot?start=ref_${user.id}`;

        function copyRef() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Реферальне посилання скопійовано!");
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function addToCart(name, flavor, price) {
            cart.push({ title: name, flavor: flavor, price: price, quantity: 1 });
            updateCartUI();
            alert("Товар додано в кошик!");
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('totalPrice');
            
            if (cart.length === 0) {
                container.innerHTML = 'Кошик порожній';
                totalEl.innerText = '0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                html += `<div style="border-bottom: 1px solid #374151; padding: 8px 0;">
                    <b>${index + 1}. ${item.title} (${item.flavor})</b> — ${item.quantity} шт. х ${item.price} ₴
                </div>`;
            });
            container.innerHTML = html;
            totalEl.innerText = total;
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("Кошик порожній!");
                return;
            }

            const phone = document.getElementById('phone').value;
            const deliveryMethod = document.getElementById('deliveryMethod').value;
            const address = document.getElementById('address').value;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);

            const orderData = {
                order_id: orderId,
                customer_name: user.first_name || 'Клієнт',
                username: user.username || '',
                user_id: user.id,
                phone: phone,
                delivery_method: deliveryMethod,
                delivery_details: address,
                items: cart,
                total_price: total
            };

            // Вставь сюда URL своего развернутого Google Apps Script
            const SCRIPT_URL = 'ЗДЕСЬ_ССЫЛКА_НА_GOOGLE_APPS_SCRIPT';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                alert("Замовлення успішно оформлено!");
                cart = [];
                updateCartUI();
                tg.close();
            } catch (err) {
                console.error(err);
                alert("Помилка при оформленні замовлення. Спробуйте ще раз.");
            }
        }
    </script>
</body>
</html>
