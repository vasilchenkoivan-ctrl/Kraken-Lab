<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kraken Lab — Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0b0e14] text-white min-h-screen pb-24 font-sans select-none antialiased">

    <!-- Верхняя шапка -->
    <header class="sticky top-0 z-40 bg-[#0b0e14]/90 backdrop-blur-md border-b border-gray-800/80 px-4 py-3 space-y-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🐙</span>
                <div>
                    <h1 class="text-base font-bold leading-none tracking-wide text-white">Kraken Lab</h1>
                    <p class="text-[10px] text-gray-400 font-medium">Premium Vape Shop</p>
                </div>
            </div>
            <div class="bg-gray-800/60 border border-gray-700/50 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-[#b8ff00] animate-pulse"></span>
                <span class="text-[11px] font-semibold text-gray-300">Онлайн</span>
            </div>
        </div>

        <!-- Поисковая строка -->
        <div id="search-box" class="relative hidden">
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Поиск по каталогу..." class="w-full bg-[#141b27] border border-gray-800 rounded-xl px-10 py-2 text-xs text-white focus:outline-none focus:border-[#b8ff00]">
            <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3 fill-current" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
    </header>

    <!-- ВКЛАДКА: КАТАЛОГ -->
    <main id="tab-catalog" class="tab-content p-4 space-y-4">
        
        <!-- Категории -->
        <div>
            <h2 class="text-sm font-bold text-gray-400 mb-2">Категории</h2>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="setCategory('all')" class="cat-btn active bg-[#b8ff00] text-black px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-md shadow-[#b8ff00]/10">Все товары</button>
                <button onclick="setCategory('Жидкости')" class="cat-btn bg-[#141b27] text-gray-400 border border-gray-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all">Жидкости</button>
                <button onclick="setCategory('Картриджи')" class="cat-btn bg-[#141b27] text-gray-400 border border-gray-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all">Картриджи</button>
                <button onclick="setCategory('Устройства')" class="cat-btn bg-[#141b27] text-gray-400 border border-gray-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all">Устройства</button>
                <button onclick="setCategory('Аксессуары')" class="cat-btn bg-[#141b27] text-gray-400 border border-gray-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all">Аксессуары</button>
            </div>
        </div>

        <h2 id="category-title" class="text-lg font-bold">Все товары</h2>

        <!-- Сетка товаров (2 колонки) -->
        <div id="products-container" class="grid grid-cols-2 gap-3">
            <div class="col-span-2 p-8 text-center text-gray-400">
                <div class="inline-block animate-spin mb-2 text-xl">⏳</div>
                <p class="text-xs">Загрузка каталога...</p>
            </div>
        </div>

        <!-- Информационный блок -->
        <div class="p-4 bg-[#141b27] rounded-2xl space-y-4 border border-gray-800/80 mt-6 shadow-xl">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-medium">Социальные сети:</p>
                    <a href="https://t.me/KRAKENOTZYVY" target="_blank" class="w-8 h-8 rounded-full bg-[#24A1DE] flex items-center justify-center text-white text-sm hover:opacity-90 transition-all shadow-md active:scale-95 mt-1.5">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.68-.55.84-1.12.52l-3.01-2.22-1.45 1.4c-.16.16-.3.3-.61.3l.21-3.04 5.54-5.01c.24-.21-.05-.33-.37-.12l-6.85 4.31-2.95-.92c-.64-.2-.65-.64.13-.95l11.52-4.44c.53-.19 1 .13.82.89z"/></svg>
                    </a>
                </div>
                <div>
                    <p class="text-xs text-gray-400 mb-1 font-medium text-right">Оплата:</p>
                    <div class="flex gap-1">
                        <span class="px-1.5 py-0.5 bg-white text-black rounded text-[9px] font-bold">VISA</span>
                        <span class="px-1.5 py-0.5 bg-white text-black rounded text-[9px] font-bold">Mastercard</span>
                        <span class="px-1.5 py-0.5 bg-gray-700 text-white rounded text-[9px] font-bold border border-gray-600">Нал</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-gray-800/60">
                <button onclick="openModal('payment')" class="py-2 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-[11px] text-gray-300 font-medium transition-all">Оплата</button>
                <button onclick="openModal('delivery')" class="py-2 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-[11px] text-gray-300 font-medium transition-all">Доставка</button>
                <button onclick="openModal('offer')" class="py-2 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-[11px] text-gray-300 font-medium transition-all">Оферта</button>
            </div>

            <button onclick="openModal('privacy')" class="w-full py-2 bg-gray-800/80 hover:bg-gray-700 rounded-xl text-[11px] text-gray-300 font-medium transition-all">
                Политика конфиденциальности
            </button>
        </div>
    </main>

    <!-- ВКЛАДКА: КОРЗИНА -->
    <main id="tab-cart" class="tab-content p-4 space-y-4 hidden">
        <h2 class="text-xl font-bold">Корзина</h2>
        <div id="cart-items" class="space-y-3"></div>
        <div id="cart-summary" class="bg-[#141b27] border border-gray-800 p-4 rounded-2xl space-y-3 hidden shadow-xl">
            <div class="flex justify-between items-center text-sm font-bold">
                <span>Итого:</span>
                <span id="cart-total-price" class="text-[#b8ff00]">0 ₴</span>
            </div>
            <button onclick="openCheckoutModal()" class="w-full py-3 bg-[#b8ff00] hover:opacity-90 text-black rounded-xl text-xs font-extrabold shadow-lg shadow-[#b8ff00]/20 active:scale-98 transition-all">
                Перейти к оформлению
            </button>
        </div>
    </main>

    <!-- ВКЛАДКА: ПРОФИЛЬ -->
    <main id="tab-profile" class="tab-content p-4 space-y-4 hidden">
        <div class="bg-[#141b27] border border-gray-800 p-5 rounded-2xl text-center space-y-3 shadow-xl">
            <div class="w-16 h-16 rounded-full bg-[#b8ff00]/20 text-[#b8ff00] flex items-center justify-center text-2xl font-bold mx-auto border border-[#b8ff00]/30">
                👤
            </div>
            <h3 id="user-name" class="text-lg font-bold">Клиент Kraken Lab</h3>
            <p class="text-xs text-gray-400">Спасибо, что вы с нами!</p>
        </div>
    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0b0e14]/95 backdrop-blur-lg border-t border-gray-800/80 px-2 py-1.5">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn active flex flex-col items-center justify-center py-1 rounded-xl text-[#b8ff00] transition-all">
                <svg class="w-5 h-5 mb-0.5 fill-current" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-[10px] font-medium">Главная</span>
            </button>
            <button onclick="switchTab('catalog')" id="nav-catalog" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-gray-400 transition-all">
                <svg class="w-5 h-5 mb-0.5 fill-current" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4v4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                <span class="text-[10px] font-medium">Каталог</span>
            </button>
            <button onclick="switchTab('cart')" id="nav-cart" class="nav-btn relative flex flex-col items-center justify-center py-1 rounded-xl text-gray-400 transition-all">
                <span id="cart-badge" class="absolute top-0.5 right-4 bg-[#b8ff00] text-black text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center hidden shadow-sm">0</span>
                <svg class="w-5 h-5 mb-0.5 fill-current" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="text-[10px] font-medium">Корзина</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-gray-400 transition-all">
                <svg class="w-5 h-5 mb-0.5 fill-current" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span class="text-[10px] font-medium">Профиль</span>
            </button>
        </div>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ТОВАРА (ВЫБОР ВКУСОВ) -->
    <div id="productModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#141b27] border border-gray-800 w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[85vh] flex flex-col shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center font-bold hover:bg-gray-700">✕</button>
            <div id="modalProductContent" class="space-y-4 overflow-y-auto pr-1"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОФОРМЛЕНИЯ ЗАКАЗА -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#141b27] border border-gray-800 w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-base font-bold border-b border-gray-800 pb-2">📦 Оформление заказа</h3>
            
            <!-- Поля ввода (без ФИО) -->
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-gray-400 font-medium mb-1 block">Номер телефона:</label>
                    <input type="tel" id="order-phone" placeholder="+380XXXXXXXXX" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-[#b8ff00]">
                </div>
                <div>
                    <label class="text-gray-400 font-medium mb-1 block">Город и № отделения Новой Почты:</label>
                    <input type="text" id="order-address" placeholder="Киев, Отделение №15" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-[#b8ff00]">
                </div>
                <div>
                    <label class="text-gray-400 font-medium mb-1 block">Способ оплаты:</label>
                    <select id="order-payment" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-[#b8ff00]">
                        <option value="Наложенный платеж">Наложенный платеж (При получении)</option>
                        <option value="Оплата на карту">Оплата на карту (Реквизиты)</option>
                    </select>
                </div>
            </div>

            <div id="checkoutText" class="text-[11px] text-gray-300 bg-gray-900/80 p-2.5 rounded-xl whitespace-pre-line border border-gray-800 my-2"></div>

            <div class="space-y-2 pt-1">
                <button onclick="sendOrder()" class="w-full py-3 bg-[#b8ff00] hover:opacity-90 rounded-xl text-xs font-extrabold text-black shadow-lg shadow-[#b8ff00]/20 active:scale-98 transition-all">
                    Отправить заказ менеджеру ✈️
                </button>
                <button onclick="closeCheckoutModal()" class="w-full py-2 bg-gray-800 hover:bg-gray-700 rounded-xl text-xs font-semibold text-gray-300">
                    Вернуться назад
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ИНФО -->
    <div id="infoModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#141b27] border border-gray-800 w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[80vh] flex flex-col shadow-2xl">
            <h3 id="infoModalTitle" class="text-lg font-bold border-b border-gray-800 pb-2">Информация</h3>
            <div id="infoModalText" class="text-sm text-gray-300 overflow-y-auto space-y-2 pr-1 whitespace-pre-line leading-relaxed"></div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-[#b8ff00] hover:opacity-90 rounded-xl text-xs font-bold text-black mt-auto active:scale-98 transition-all">Закрыть</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://osmeveovehxgktmprmsh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zbWV2ZW92ZWh4Z2t0bXBybXNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDk4OTgsImV4cCI6MjEwNzkyNTg5OH0.c02JXer1IQSpbTRJ81pnONTj-kSwOmC9XzLIGJZwGX8';

        let allProducts = [];
        let selectedCategory = 'all';
        let cart = [];
        let activeFlavors = {};

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name || 'Клиент';
            }
        }

        function parseFlavors(flavorsData) {
            if (!flavorsData) return [];
            if (Array.isArray(flavorsData)) return flavorsData;
            if (typeof flavorsData === 'string') {
                try {
                    const parsed = JSON.parse(flavorsData);
                    if (Array.isArray(parsed)) return parsed;
                } catch(e) {
                    return flavorsData.split(',').map(s => s.trim()).filter(Boolean);
                }
            }
            return [];
        }

        async function fetchAndRenderProducts() {
            const container = document.getElementById('products-container');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!response.ok) throw new Error(`Ошибка API: ${response.statusText}`);
                allProducts = await response.json();
                renderFilteredProducts();
            } catch (error) {
                container.innerHTML = `<p class="col-span-2 text-red-400 text-center text-xs p-4 bg-[#141b27] rounded-2xl border border-gray-800">Ошибка загрузки: ${error.message}</p>`;
            }
        }

        function renderFilteredProducts() {
            const container = document.getElementById('products-container');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allProducts.filter(p => {
                const matchesCat = selectedCategory === 'all' || (p.category && p.category.toLowerCase() === selectedCategory.toLowerCase());
                const title = (p.title || p.name || '').toLowerCase();
                return matchesCat && title.includes(searchVal);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-2 text-center text-gray-400 text-sm py-8 bg-[#141b27] rounded-2xl border border-gray-800">Товаров не найдено</p>`;
                return;
            }

            container.innerHTML = '';

            filtered.forEach(product => {
                const title = product.title || product.name || 'Товар';
                const price = product.price || 0;
                const image = product.image ? `<img src="${product.image}" class="w-full h-32 object-cover rounded-xl mb-2 shadow-md pointer-events-none" alt="${title}">` : `<div class="w-full h-32 bg-gray-800/50 rounded-xl mb-2 flex items-center justify-center text-2xl">📦</div>`;

                const card = document.createElement('div');
                card.className = "bg-[#141b27] p-3 rounded-2xl border border-gray-800/80 shadow-md flex flex-col justify-between cursor-pointer hover:border-gray-700 transition-all";
                card.onclick = () => openProductModal(product.id);

                card.innerHTML = `
                    <div>
                        ${image}
                        <h3 class="text-xs font-bold line-clamp-1 text-white">${title}</h3>
                    </div>
                    <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-800/50">
                        <span class="text-sm font-extrabold text-white">${price} ₴</span>
                        <button onclick="event.stopPropagation(); openProductModal('${product.id}')" class="w-8 h-8 rounded-full bg-[#b8ff00] text-black font-extrabold flex items-center justify-center shadow-md active:scale-95 transition-all text-base">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openProductModal(productId) {
            const product = allProducts.find(p => p.id == productId);
            if (!product) return;

            const title = product.title || product.name || 'Товар';
            const price = product.price || 0;
            const image = product.image ? `<img src="${product.image}" class="w-full h-48 object-cover rounded-xl mb-3 shadow-md" alt="${title}">` : '';
            const description = product.description ? `<p class="text-xs text-gray-300 mb-2">${product.description}</p>` : '';

            const flavors = parseFlavors(product.flavors);

            let flavorsHtml = '';
            if (flavors.length > 0) {
                if(!activeFlavors[product.id]) activeFlavors[product.id] = flavors[0];
                flavorsHtml = `
                    <div class="mt-2">
                        <p class="text-xs text-gray-400 mb-2 font-medium">Выберите вкус:</p>
                        <div class="flex flex-wrap gap-1.5">
                            ${flavors.map((flavor) => `
                                <button onclick="selectModalFlavor(event, '${product.id}', '${flavor}')" 
                                    class="modal-flavor-${product.id} px-3 py-1.5 rounded-xl text-xs font-medium transition-all${activeFlavors[product.id] === flavor ? 'bg-[#b8ff00] text-black font-bold border border-[#b8ff00]' : 'bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700'}">
                                    ${flavor}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('modalProductContent').innerHTML = `
                ${image}
                <h3 class="text-base font-bold">${title}</h3>
                ${description}
                ${flavorsHtml}
                <div class="flex items-center justify-between pt-3 border-t border-gray-800 mt-4">
                    <span class="text-lg font-bold text-[#b8ff00]">${price} ₴</span>
                    <button onclick="addModalItemToCart('${product.id}')" class="bg-[#b8ff00] hover:opacity-90 px-5 py-2.5 rounded-xl text-xs font-extrabold text-black shadow-lg active:scale-95 transition-all">
                        В корзину
                    </button>
                </div>
            `;
            document.getElementById('productModal').style.display = 'flex';
        }

        function selectModalFlavor(event, productId, flavor) {
            event.stopPropagation();
            activeFlavors[productId] = flavor;
            document.querySelectorAll(`.modal-flavor-${productId}`).forEach(b => {
                b.className = `modal-flavor-${productId} px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-gray-800 text-gray-300 border border-gray-700 hover:bg-gray-700`;
            });
            event.target.className = `modal-flavor-${productId} px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-[#b8ff00] text-black border border-[#b8ff00]`;
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addModalItemToCart(productId) {
            const product = allProducts.find(p => p.id == productId);
            if (!product) return;

            const flavor = activeFlavors[productId] || '';
            const cartItem = cart.find(item => item.id == productId && item.flavor == flavor);

            if (cartItem) {
                cartItem.count++;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title || product.name,
                    price: product.price,
                    flavor: flavor,
                    count: 1
                });
            }

            updateCartUI();
            closeProductModal();
            if(tg) tg.HapticFeedback?.impactOccurred('medium');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-[#141b27] text-gray-400 border border-gray-800 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all";
            });
            event.target.className = "cat-btn active bg-[#b8ff00] text-black px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-md shadow-[#b8ff00]/10";
            
            const titles = { 'all': 'Все товары', 'Жидкости': 'Жидкости', 'Картриджи': 'Картриджи', 'Устройства': 'Устройства', 'Аксессуары': 'Аксессуары' };
            document.getElementById('category-title').innerText = titles[cat] || 'Товары';
            renderFilteredProducts();
        }

        function filterProducts() {
            renderFilteredProducts();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((sum, item) => sum + item.count, 0);
            
            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const cartContainer = document.getElementById('cart-items');
            const cartSummary = document.getElementById('cart-summary');

            if (cart.length === 0) {
                cartContainer.innerHTML = `<p class="text-center text-gray-400 text-sm py-8 bg-[#141b27] rounded-2xl border border-gray-800">Ваша корзина пуста</p>`;
                cartSummary.classList.add('hidden');
                return;
            }

            cartSummary.classList.remove('hidden');
            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.count;
                const div = document.createElement('div');
                div.className = "bg-[#141b27] p-3.5 rounded-2xl border border-gray-800 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-sm">${item.title}</h4>
                        ${item.flavor ? `<p class="text-xs text-[#b8ff00]">Вкус: ${item.flavor}</p>` : ''}
                        <p class="text-xs font-bold text-white mt-1">${item.price * item.count} ₴</p>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-800/80 p-1 rounded-xl border border-gray-700/50">
                        <button onclick="changeCount(${index}, -1)" class="w-6 h-6 rounded-lg bg-gray-700 flex items-center justify-center text-xs font-bold">-</button>
                        <span class="text-xs font-bold w-4 text-center">${item.count}</span>
                        <button onclick="changeCount(${index}, 1)" class="w-6 h-6 rounded-lg bg-[#b8ff00] text-black flex items-center justify-center text-xs font-bold">+</button>
                    </div>
                `;
                cartContainer.appendChild(div);
            });

            document.getElementById('cart-total-price').innerText = `${total} ₴`;
        }

        function changeCount(index, delta) {
            cart[index].count += delta;
            if (cart[index].count <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-[#b8ff00]', 'active');
                b.classList.add('text-gray-400');
            });

            const searchBox = document.getElementById('search-box');

            if (tab === 'home' || tab === 'catalog') {
                document.getElementById('tab-catalog').classList.remove('hidden');
                searchBox.classList.add('hidden');
                document.getElementById(tab === 'home' ? 'nav-home' : 'nav-catalog').classList.add('text-[#b8ff00]', 'active');
            } else if (tab === 'search') {
                document.getElementById('tab-catalog').classList.remove('hidden');
                searchBox.classList.remove('hidden');
                document.getElementById('nav-search').classList.add('text-[#b8ff00]', 'active');
            } else if (tab === 'cart') {
                document.getElementById('tab-cart').classList.remove('hidden');
                document.getElementById('nav-cart').classList.add('text-[#b8ff00]', 'active');
            } else if (tab === 'profile') {
                document.getElementById('tab-profile').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('text-[#b8ff00]', 'active');
            }
        }

        function openCheckoutModal() {
            if (cart.length === 0) return;
            let summary = "Состав заказа:\n";
            let total = 0;
            cart.forEach(item => {
                summary += `• ${item.title} ${item.flavor ? `(${item.flavor})` : ''} x${item.count} = ${item.price * item.count} ₴\n`;
                total += item.price * item.count;
            });
            summary += `\nК оплате: ${total} ₴`;

            document.getElementById('checkoutText').innerText = summary;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function sendOrder() {
            const phone = document.getElementById('order-phone').value.trim();
            const address = document.getElementById('order-address').value.trim();
            const payment = document.getElementById('order-payment').value;

            if (!phone || !address) {
                alert("Заполните, пожалуйста, номер телефона и адрес Новой Почты!");
                return;
            }

            let text = `🛒 НОВЫЙ ЗАКАЗ — Kraken Lab\n\n`;
            text += `📞 Телефон: ${phone}\n`;
            text += `📦 Доставка: ${address}\n`;
            text += `💳 Оплата: ${payment}\n\n`;
            text += `--- Состав заказа ---\n`;

            let total = 0;
            cart.forEach(item => {
                text += `• ${item.title} ${item.flavor ? `[Смак: ${item.flavor}]` : ''} x${item.count} = ${item.price * item.count} ₴\n`;
                total += item.price * item.count;
            });
            text += `\nИтого: ${total} ₴`;

            if (tg && tg.sendData) {
                try { tg.sendData(text); } catch(e) {}
            }

            const managerUrl = `https://t.me/KRAKENOTZYVY?text=${encodeURIComponent(text)}`;
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(managerUrl);
            } else {
                window.open(managerUrl, '_blank');
            }
            
            closeCheckoutModal();
        }

        const infoTexts = {
            payment: "💳 Способы оплаты:\n\n• Оплата банковской картой (Visa / Mastercard)\n• Наличными при получении в отделении или курьеру (Наложенный платеж)",
            delivery: "📦 ДОСТАВКА\n\nОформляя заказ, выберите доставку в отделение НП или до дверей службой “Нова Пошта”.\n\nДля получения заказа при себе нужно иметь документ, удостоверяющий личность (паспорт или водительские права), а также знать номер накладной посылки.",
            offer: "📄 ПУБЛИЧНАЯ ОФЕРТА\n\n1. Общие положения\nЭта оферта является официальным предложением магазина Kraken Lab по продаже товаров, представленных в данном Mini App.\n\n2. Оформление заказа\nПокупатель самостоятельно оформляет заказ через интерфейс приложения.\n\n3. Ограничение ответственности\nАдминистрация и магазин не несут ответственности за ненадлежащее использование товаров Покупателем, за задержки или сбои в доставке по вине транспортных/почтовых служб, а также за любые косвенные убытки или форс-мажорные обстоятельства. Все товары предоставляются по принципу «как есть».\n\n4. Возврат и обмен\nВозврат и обмен товаров осуществляется в соответствии с действующим законодательством.",
            privacy: "🔒 ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ\n\nМы уважаем вашу приватность. Все персональные данные используются исключительно для выполнения и доставки вашего заказа и не передаются третьим лицам."
        };

        function openModal(type) {
            const titles = { payment: "Оплата", delivery: "Доставка", offer: "Публичная оферта", privacy: "Политика конфиденциальности" };
            document.getElementById('infoModalTitle').innerText = titles[type] || "Информация";
            document.getElementById('infoModalText').innerText = infoTexts[type];
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        fetchAndRenderProducts();
    </script>
</body>
</html>
