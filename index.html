<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Kraken Lab</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --bg: #080808;
    --card: #131313;
    --green: #39ff14;
    --text: #f5f5f5;
    --muted: #929292;
    --border: #292929;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0 0 95px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

button, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 18px 16px 12px;
    background: rgba(8,8,8,.96);
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: var(--green);
}

.subtitle {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 16px;
}

.hero {
    padding: 22px 18px;
    border: 1px solid #263b21;
    border-radius: 18px;
    background: radial-gradient(circle at top right, #173014, #111 60%);
    margin-bottom: 20px;
}

.hero h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.hero p {
    margin: 0;
    color: #b4b4b4;
    font-size: 13px;
    line-height: 1.5;
}

.section-title {
    margin: 22px 0 13px;
    font-size: 18px;
    font-weight: 800;
}

.search {
    width: 100%;
    padding: 14px;
    background: #141414;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: white;
    outline: none;
    margin-bottom: 12px;
}

.search:focus, input:focus, textarea:focus, select:focus {
    border-color: var(--green);
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.cat-btn {
    flex-shrink: 0;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: #141414;
    color: #bbb;
    font-size: 12px;
}

.cat-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    font-weight: 800;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.product {
    overflow: hidden;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: var(--card);
}

.product-image {
    height: 150px;
    background: #1b1b1b;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.placeholder {
    font-size: 44px;
}

.product-info {
    padding: 12px;
}

.product-name {
    font-size: 14px;
    font-weight: 800;
    min-height: 36px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.product-category {
    color: var(--muted);
    font-size: 10px;
    margin-top: 5px;
}

.product-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    margin-top: 13px;
}

.price {
    font-size: 15px;
    font-weight: 900;
    white-space: nowrap;
}

.price span {
    color: var(--green);
}

.add-btn {
    border: 0;
    border-radius: 9px;
    background: var(--green);
    color: #000;
    font-weight: 900;
    width: 36px;
    height: 34px;
    font-size: 22px;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #000;
    font-weight: 900;
    margin-top: 12px;
}

.secondary-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #161616;
    color: white;
    margin-top: 10px;
}

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 14px;
}

.hidden {
    display: none !important;
}

.empty {
    text-align: center;
    padding: 35px 15px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 15px;
    grid-column: 1 / -1;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}

.cart-item:last-child {
    border-bottom: 0;
}

.cart-name {
    font-weight: 700;
    font-size: 13px;
}

.cart-sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
}

.quantity button {
    width: 29px;
    height: 29px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #222;
    color: white;
}

.form-label {
    display: block;
    color: #bbb;
    font-size: 12px;
    margin: 13px 0 7px;
}

.field {
    width: 100%;
    background: #090909;
    color: white;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
}

textarea.field {
    min-height: 75px;
    resize: vertical;
}

.total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    font-size: 17px;
    font-weight: 900;
}

.total-row strong {
    color: var(--green);
}

.history-item {
    padding: 14px;
    background: #101010;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
}

.status {
    color: var(--green);
    font-size: 12px;
    margin-top: 8px;
}

.bottom-nav {
    position: fixed;
    z-index: 20;
    bottom: 0;
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #101010;
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
}

.nav-btn {
    position: relative;
    border: 0;
    background: transparent;
    color: #888;
    padding: 7px 2px;
    font-size: 11px;
}

.nav-btn.active {
    color: var(--green);
}

.nav-icon {
    display: block;
    font-size: 20px;
    margin-bottom: 4px;
}

.badge {
    position: absolute;
    top: 0;
    margin-left: -2px;
    background: var(--green);
    color: black;
    font-size: 10px;
    font-weight: 900;
    border-radius: 20px;
    min-width: 17px;
    padding: 2px 4px;
}

.message {
    padding: 13px;
    border-radius: 10px;
    background: #151515;
    margin-bottom: 12px;
    color: #ccc;
    font-size: 13px;
}

.message.error {
    color: #ff7b7b;
    border: 1px solid #542525;
}

.message.success {
    color: var(--green);
    border: 1px solid #244a1b;
}

@media (max-width: 360px) {
    main {
        padding: 12px;
    }

    .product-image {
        height: 125px;
    }

    .product-info {
        padding: 9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">KRAKEN <span>LAB</span> 🐙</div>
    <div class="subtitle">YOUR LAB. YOUR CHOICE.</div>
</header>

<main>
    <section id="catalog-page">
        <div class="hero">
            <h1>Ласкаво просимо 🐙</h1>
            <p>Kraken Lab — обирай свій товар, додавай у кошик та оформлюй замовлення за декілька кліків.</p>
        </div>

        <input id="search" class="search" type="search"
               placeholder="🔍 Пошук товарів..."
               oninput="renderProducts()">

        <div class="categories" id="categories">
            <button class="cat-btn active" onclick="setCategory('all',this)">Усі товари</button>
            <button class="cat-btn" onclick="setCategory('liquid',this)">Рідини</button>
            <button class="cat-btn" onclick="setCategory('cartridge',this)">Картриджі</button>
            <button class="cat-btn" onclick="setCategory('device',this)">Пристрої</button>
            <button class="cat-btn" onclick="setCategory('accessory',this)">Аксесуари</button>
        </div>

        <div class="section-title">Каталог товарів</div>
        <div id="catalog-message" class="message hidden"></div>
        <div id="products" class="products">
            <div class="empty">⏳ Завантажуємо каталог...</div>
        </div>
    </section>

    <section id="cart-page" class="hidden">
        <div class="section-title">🛒 Кошик</div>
        <div id="cart-items" class="panel"></div>

        <div id="checkout-panel" class="panel hidden">
            <div class="section-title" style="margin-top:0">Оформлення замовлення</div>

            <label class="form-label" for="customer-name">Ваше ім’я *</label>
            <input id="customer-name" class="field" placeholder="Ім’я">

            <label class="form-label" for="customer-phone">Номер телефону *</label>
            <input id="customer-phone" class="field" type="tel" placeholder="+380...">

            <label class="form-label" for="delivery">Спосіб отримання *</label>
            <select id="delivery" class="field" onchange="updateAddressLabel()">
                <option value="Нова пошта">Нова пошта</option>
                <option value="Самовивіз">Самовивіз</option>
            </select>

            <label class="form-label" id="address-label" for="address">Місто та відділення *</label>
            <input id="address" class="field" placeholder="Місто, номер відділення">

            <label class="form-label" for="comment">Коментар до замовлення</label>
            <textarea id="comment" class="field" placeholder="Необов’язково"></textarea>

            <div id="checkout-message" class="message hidden"></div>
            <button id="submit-order" class="primary-btn" onclick="submitOrder()">Підтвердити замовлення</button>
        </div>
    </section>

    <section id="history-page" class="hidden">
        <div class="section-title">📦 Історія замовлень</div>
        <div id="history-items"></div>
    </section>
</main>

<nav class="bottom-nav">
    <button id="nav-catalog" class="nav-btn active" onclick="switchTab('catalog')">
        <span class="nav-icon">🏪</span>Каталог
    </button>
    <button id="nav-cart" class="nav-btn" onclick="switchTab('cart')">
        <span class="nav-icon">🛒</span>Кошик <span id="cart-badge" class="badge hidden">0</span>
    </button>
    <button id="nav-history" class="nav-btn" onclick="switchTab('history')">
        <span class="nav-icon">📦</span>Замовлення
    </button>
</nav>

<script>
'use strict';

const API_URL = 'https://kraken-lab.onrender.com';
const SPREADSHEET_ID = '1-al9u_eJ1l6GRV0h6A3gxgm_bZSI-AlUHVQWDMMbWJM';
const SHEET_URL =
    'https://docs.google.com/spreadsheets/d/' +
    SPREADSHEET_ID +
    '/gviz/tq?tqx=out:json';

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}

const telegramUser = tg && tg.initDataUnsafe
    ? tg.initDataUnsafe.user
    : null;

const userId = telegramUser ? String(telegramUser.id) : '';

let allProducts = [];
let selectedCategory = 'all';
let cart = [];

try {
    cart = JSON.parse(localStorage.getItem('kraken_cart') || '[]');

    if (!Array.isArray(cart)) {
        cart = [];
    }
} catch (error) {
    cart = [];
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}

function formatPrice(value) {
    return Number(value || 0).toLocaleString('uk-UA') + ' грн';
}

function getCell(cell) {
    if (!cell) return '';
    return cell.v ?? cell.f ?? '';
}

function categoryMatches(category, selected) {
    if (selected === 'all') return true;

    const value = String(category || '').toLowerCase();

    const synonyms = {
        liquid: ['liquid', 'рідина', 'рідини', 'жидкость', 'жидкости', 'соль', 'salt'],
        cartridge: ['cartridge', 'картридж', 'картриджі', 'картриджи'],
        device: ['device', 'пристрій', 'пристрої', 'устройство', 'устройства', 'pod', 'под'],
        accessory: ['accessory', 'аксесуар', 'аксесуари', 'аксессуар', 'аксессуары']
    };

    return (synonyms[selected] || []).some(word => value.includes(word));
}

async function fetchProducts() {
    const container = document.getElementById('products');

    try {
        const response = await fetch(SHEET_URL);

        if (!response.ok) {
            throw new Error('Google Таблиця повернула помилку ' + response.status);
        }

        const text = await response.text();
        const start = text.indexOf('{');
        const end = text.lastIndexOf('}');

        if (start === -1 || end === -1) {
            throw new Error('Невірна відповідь Google Таблиці');
        }

        const data = JSON.parse(text.slice(start, end + 1));

        if (data.status === 'error') {
            throw new Error('Немає доступу до Google Таблиці');
        }

        const rows = data.table && data.table.rows
            ? data.table.rows
            : [];

        allProducts = rows.map((row, index) => {
            const cells = row.c || [];

            return {
                id: String(index + 1),
                title: String(getCell(cells[0])).trim(),
                category: String(getCell(cells[1])).trim(),
                price: parsePrice(getCell(cells[2])),
                flavors: String(getCell(cells[3])).trim(),
                image: String(getCell(cells[4])).trim()
            };
        }).filter(product => product.title);

        if (!allProducts.length) {
            throw new Error('У таблиці не знайдено товарів. Перевір стовпці A–E.');
        }

        document.getElementById('catalog-message').classList.add('hidden');
        renderProducts();

    } catch (error) {
        console.error('Catalog error:', error);

        container.innerHTML =
            '<div class="empty">Не вдалося завантажити каталог.<br><br>' +
            escapeHtml(error.message) +
            '<br><br><button class="primary-btn" onclick="fetchProducts()">Спробувати ще раз</button></div>';
    }
}

function parsePrice(value) {
    if (typeof value === 'number') return value;

    const normalized = String(value || '')
        .replace(/\s/g, '')
        .replace(',', '.')
        .replace(/[^\d.]/g, '');

    return Number(normalized) || 0;
}

function setCategory(category, button) {
    selectedCategory = category;

    document.querySelectorAll('.cat-btn').forEach(item => {
        item.classList.remove('active');
    });

    button.classList.add('active');
    renderProducts();
}

function renderProducts() {
    const container = document.getElementById('products');
    const query = document.getElementById('search').value.toLowerCase().trim();

    const products = allProducts.filter(product => {
        const matchesCategory = categoryMatches(product.category, selectedCategory);

        const matchesSearch =
            product.title.toLowerCase().includes(query) ||
            product.category.toLowerCase().includes(query) ||
            product.flavors.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
    });

    if (!products.length) {
        container.innerHTML =
            '<div class="empty">Товарів не знайдено.</div>';
        return;
    }

    container.innerHTML = products.map(product => {
        const image = product.image
            ? '<img src="' + escapeHtml(product.image) +
              '" alt="' + escapeHtml(product.title) +
              '" onerror="this.parentElement.innerHTML=\'<div class=&quot;placeholder&quot;>🐙</div>\'">'
            : '<div class="placeholder">🐙</div>';

        return `
            <article class="product">
                <div class="product-image">${image}</div>
                <div class="product-info">
                    <div class="product-name">${escapeHtml(product.title)}</div>
                    <div class="product-category">${escapeHtml(product.category)}</div>
                    ${product.flavors
                        ? `<div class="product-category">Смаки: ${escapeHtml(product.flavors)}</div>`
                        : ''}
                    <div class="product-bottom">
                        <div class="price"><span>${formatPrice(product.price)}</span></div>
                        <button class="add-btn" onclick="addToCart('${escapeHtml(product.id)}')">+</button>
                    </div>
                </div>
            </article>
        `;
    }).join('');
}

function addToCart(id) {
    const product = allProducts.find(item => item.id === String(id));

    if (!product) return;

    let flavor = '';

    if (product.flavors) {
        const flavors = product.flavors
            .split(/[,;\n]/)
            .map(item => item.trim())
            .filter(Boolean);

        if (flavors.length > 1) {
            flavor = prompt(
                'Оберіть смак:\n' + flavors.join('\n'),
                flavors[0]
            );

            if (flavor === null) return;

            flavor = flavor.trim();

            if (!flavors.some(item => item.toLowerCase() === flavor.toLowerCase())) {
                alert('Оберіть смак зі списку.');
                return;
            }
        } else {
            flavor = flavors[0] || product.flavors;
        }
    }

    const existing = cart.find(item =>
        item.id === product.id && item.flavor === flavor
    );

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            id: product.id,
            title: product.title,
            price: product.price,
            flavor,
            quantity: 1
        });
    }

    saveCart();
    updateCartUI();
}

function saveCart() {
    localStorage.setItem('kraken_cart', JSON.stringify(cart));
}

function cartTotal() {
    return cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );
}

function cartCount() {
    return cart.reduce((sum, item) => sum + item.quantity, 0);
}

function changeQuantity(index, amount) {
    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
    updateCartUI();
}

function updateCartUI() {
    const container = document.getElementById('cart-items');
    const checkout = document.getElementById('checkout-panel');
    const badge = document.getElementById('cart-badge');
    const count = cartCount();

    badge.textContent = count;
    badge.classList.toggle('hidden', count === 0);

    if (!cart.length) {
        container.innerHTML =
            '<div class="empty">🛒<br><br>Кошик поки порожній.</div>';

        checkout.classList.add('hidden');
        return;
    }

    container.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <div>
                <div class="cart-name">${escapeHtml(item.title)}</div>
                ${item.flavor
                    ? `<div class="cart-sub">Смак: ${escapeHtml(item.flavor)}</div>`
                    : ''}
                <div class="cart-sub">${formatPrice(item.price)} за шт.</div>
                <div class="quantity">
                    <button onclick="changeQuantity(${index},-1)">−</button>
                    <strong>${item.quantity}</strong>
                    <button onclick="changeQuantity(${index},1)">+</button>
                </div>
            </div>
            <strong>${formatPrice(item.price * item.quantity)}</strong>
        </div>
    `).join('') + `
        <div class="total-row">
            <span>Разом</span>
            <strong>${formatPrice(cartTotal())}</strong>
        </div>
    `;

    checkout.classList.remove('hidden');
}

function updateAddressLabel() {
    const delivery = document.getElementById('delivery').value;
    const label = document.getElementById('address-label');
    const input = document.getElementById('address');

    if (delivery === 'Самовивіз') {
        label.textContent = 'Коментар щодо отримання';
        input.placeholder = 'Уточніть деталі отримання';
        input.required = false;
    } else {
        label.textContent = 'Місто та відділення *';
        input.placeholder = 'Місто, номер відділення';
        input.required = true;
    }
}

function switchTab(tab) {
    const pages = {
        catalog: 'catalog-page',
        cart: 'cart-page',
        history: 'history-page'
    };

    Object.entries(pages).forEach(([key, id]) => {
        document.getElementById(id).classList.toggle('hidden', key !== tab);

        const nav = document.getElementById('nav-' + key);
        nav.classList.toggle('active', key === tab);
    });

    if (tab === 'cart') updateCartUI();
    if (tab === 'history') renderHistory();
}

function showCheckoutMessage(message, type) {
    const element = document.getElementById('checkout-message');

    element.textContent = message;
    element.className = 'message ' + type;
    element.classList.remove('hidden');
}

async function submitOrder() {
    if (!cart.length) {
        alert('Кошик порожній.');
        return;
    }

    const name = document.getElementById('customer-name').value.trim();
    const phone = document.getElementById('customer-phone').value.trim();
    const delivery = document.getElementById('delivery').value;
    const address = document.getElementById('address').value.trim();
    const comment = document.getElementById('comment').value.trim();
    const button = document.getElementById('submit-order');

    if (!name || !phone) {
        showCheckoutMessage('Вкажіть ім’я та номер телефону.', 'error');
        return;
    }

    if (delivery === 'Нова пошта' && !address) {
        showCheckoutMessage('Вкажіть місто та відділення Нової пошти.', 'error');
        return;
    }

    if (!/^[+\d()\-\s]{7,20}$/.test(phone)) {
        showCheckoutMessage('Перевірте номер телефону.', 'error');
        return;
    }

    button.disabled = true;
    button.textContent = 'Відправляємо замовлення...';

    const orderPayload = {
        name,
        phone,
        delivery,
        address,
        comment,
        userId,
        items: cart.map(item => ({
            title: item.title,
            flavor: item.flavor,
            price: item.price,
            quantity: item.quantity
        }))
    };

    try {
        const response = await fetch(API_URL + '/api/order', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(orderPayload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || 'Не вдалося оформити замовлення.');
        }

        const order = {
            id: result.orderId,
            name,
            phone,
            delivery,
            address,
            comment,
            items: orderPayload.items,
            total: result.total || cartTotal(),
            status: 'Прийнято',
            createdAt: new Date().toISOString()
        };

        let history = [];

        try {
            history = JSON.parse(localStorage.getItem('kraken_orders') || '[]');

            if (!Array.isArray(history)) history = [];
        } catch (error) {
            history = [];
        }

        history.unshift(order);

        localStorage.setItem(
            'kraken_orders',
            JSON.stringify(history.slice(0, 50))
        );

        cart = [];
        saveCart();
        updateCartUI();

        document.getElementById('customer-name').value = name;
        document.getElementById('customer-phone').value = phone;
        document.getElementById('address').value = '';
        document.getElementById('comment').value = '';

        alert(
            '🐙 Замовлення оформлено!\n\n' +
            'Номер: ' + order.id + '\n' +
            'Сума: ' + formatPrice(order.total)
        );

        switchTab('history');

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

    } catch (error) {
        console.error('Order error:', error);

        showCheckoutMessage(
            error.message || 'Помилка. Спробуйте ще раз.',
            'error'
        );

    } finally {
        button.disabled = false;
        button.textContent = 'Підтвердити замовлення';
    }
}

function renderHistory() {
    const container = document.getElementById('history-items');

    let history = [];

    try {
        history = JSON.parse(localStorage.getItem('kraken_orders') || '[]');

        if (!Array.isArray(history)) history = [];
    } catch (error) {
        history = [];
    }

    if (!history.length) {
        container.innerHTML =
            '<div class="empty">📦<br><br>Тут з’являться ваші замовлення.</div>';
        return;
    }

    container.innerHTML = history.map(order => {
        const date = order.createdAt
            ? new Date(order.createdAt).toLocaleString('uk-UA')
            : '';

        const items = (order.items || []).map(item =>
            escapeHtml(item.title) +
            (item.flavor ? ' (' + escapeHtml(item.flavor) + ')' : '') +
            ' × ' + Number(item.quantity || 1)
        ).join('<br>');

        return `
            <div class="history-item">
                <strong>Замовлення ${escapeHtml(order.id)}</strong>
                <div class="cart-sub">${escapeHtml(date)}</div>
                <div style="margin-top:12px;font-size:13px;line-height:1.8">${items}</div>
                <div class="total-row">
                    <span>Сума</span>
                    <strong>${formatPrice(order.total)}</strong>
                </div>
                <div class="status">● ${escapeHtml(order.status || 'Прийнято')}</div>
            </div>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    updateCartUI();
    fetchProducts();
    updateAddressLabel();
});
</script>
