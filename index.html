<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken Lab</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent: #22c55e;
            --text-color: #ffffff;
            --text-secondary: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }
        header {
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #262930;
        }
        .container {
            padding: 16px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #262930;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #161920;
            border-top: 1px solid #262930;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>🐙 KRAKEN LAB</header>

    <div class="container">
        <!-- Головна -->
        <div id="tab-home" class="tab-content active">
            <div class="card">
                <h3>🎁 Запрошуй друзів — отримуй жижу безкоштовно!</h3>
                <p style="color: var(--text-secondary); font-size: 14px;">За кожного друга, який зробить замовлення за твоїм посиланням, ти отримуєш знижку!</p>
                <input type="text" id="refLink" readonly style="font-size: 12px;" />
                <button class="btn" onclick="copyRef()">Скопіювати</button>
            </div>
        </div>

        <!-- Каталог -->
        <div id="tab-catalog" class="tab-content">
            <h2>Каталог товарів</h2>
            <div class="card">
                <h3>Chaser 30ml 50mg (apple)</h3>
                <p>Ціна: 300 ₴</p>
                <button class="btn" onclick="addToCart('Chaser 30ml 50mg (apple)', 300)">Додати в кошик</button>
            </div>
        </div>

        <!-- Кошик -->
        <div id="tab-cart" class="tab-content">
            <h2>Кошик</h2>
            <div id="cartItems">Кошик порожній</div>
            
            <div class="card" style="margin-top: 20px;">
                <h3>Оформлення</h3>
                <label>Спосіб доставки:</label>
                <select id="deliveryMethod">
                    <option value="Самовивіз">Самовивіз (Київ, вул. Остафія Дашкевича)</option>
                    <option value="Нова Пошта">Нова Пошта</option>
                </select>

                <label>Телефон:</label>
                <input type="tel" id="phone" placeholder="+380..." value="+380" />

                <label>Деталі:</label>
                <input type="text" id="address" placeholder="Коментар або відділення" />

                <h3>До сплати: <span id="totalPrice">0</span> ₴</h3>
                <button class="btn" onclick="checkout()">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
            </div>
        </div>

        <!-- Історія -->
        <div id="tab-history" class="tab-content">
            <h2>Історія замовлень</h2>
            <div id="historyContainer">Замовлень поки немає</div>
        </div>
    </div>

    <!-- Навигация -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', this)">🏠 Головна</button>
        <button class="nav-item" onclick="switchTab('catalog', this)">📦 Каталог</button>
        <button class="nav-item" onclick="switchTab('cart', this)">🛒 Кошик</button>
        <button class="nav-item" onclick="switchTab('history', this)">📄 Історія</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];
        let historyOrders = JSON.parse(localStorage.getItem('kraken_history') || '[]');
        const user = tg.initDataUnsafe?.user || { id: '1005867951', first_name: 'Vanyok', username: 'Telleportt' };

        document.getElementById('refLink').value = `https://t.me/KrakenliquidLAB_bot?start=ref_${user.id}`;

        function copyRef() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Посилання скопійовано!");
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            if(el) el.classList.add('active');
            if(tabName === 'history') renderHistory();
        }

        function addToCart(title, price) {
            cart.push({ title: title, price: price, quantity: 1 });
            updateCartUI();
            alert("Товар додано в кошик!");
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('totalPrice');
            if (cart.length === 0) {
                container.innerHTML = 'Кошик порожній';
                totalEl.innerText = '0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                html += `<div style="border-bottom: 1px solid #374151; padding: 8px 0;"><b>${index + 1}. ${item.title}</b> — ${item.quantity} шт. х ${item.price} ₴</div>`;
            });
            container.innerHTML = html;
            totalEl.innerText = total;
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyOrders.length === 0) {
                container.innerHTML = 'Замовлень поки немає';
                return;
            }
            let html = '';
            historyOrders.forEach(ord => {
                html += `<div class="card">
                    <div style="font-size: 12px; color: var(--text-secondary);">${ord.date} — <span style="color: var(--accent);">В обробці</span></div>
                    <div style="margin-top: 8px;"><b>Товари:</b> ${ord.itemsText}</div>
                    <div style="margin-top: 4px;"><b>Доставка:</b> ${ord.delivery} (${ord.details})</div>
                    <div style="margin-top: 8px; font-weight: bold;">Сума: ${ord.total} ₴</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("Кошик порожній!");
                return;
            }

            const phone = document.getElementById('phone').value;
            const deliveryMethod = document.getElementById('deliveryMethod').value;
            const address = document.getElementById('address').value || 'Київ, вул. Остафія Дашкевича';
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);

            let itemsText = cart.map(i => `${i.title} x ${i.quantity}`).join(', ');

            const orderData = {
                orderId: orderId,
                name: user.first_name || 'Клієнт',
                username: user.username || '',
                userId: user.id,
                phone: phone,
                deliveryMethod: deliveryMethod,
                deliveryDetails: address,
                items: cart,
                totalPrice: total
            };

            // Прямая ссылка на бэкенд Render
            const RENDER_URL = 'https://kraken-lab-backend.onrender.com/api/order';

            try {
                const response = await fetch(RENDER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    historyOrders.unshift({
                        date: new Date().toLocaleString(),
                        itemsText: itemsText,
                        delivery: deliveryMethod,
                        details: address,
                        total: total
                    });
                    localStorage.setItem('kraken_history', JSON.stringify(historyOrders));

                    alert("Замовлення успішно оформлено!");
                    cart = [];
                    updateCartUI();
                    switchTab('history', document.querySelectorAll('.nav-item')[3]);
                } else {
                    alert("Помилка при оформленні. Спробуйте ще раз.");
                }
            } catch (err) {
                console.error(err);
                alert("Помилка зв'язку з сервером.");
            }
        }
    </script>
</body>
</html>
