<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Store Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 70px;
    }
    /* Баннер */
    .banner {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1f2937, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      position: relative;
    }
    .banner h2 {
      font-size: 22px;
      color: #3b82f6;
    }
    /* Категории */
    .categories {
      display: flex;
      gap: 10px;
      padding: 15px 10px;
      overflow-x: auto;
    }
    .cat-btn {
      background: #1e1e1e;
      color: #ccc;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      font-size: 14px;
    }
    .cat-btn.active {
      border-color: #3b82f6;
      color: #fff;
    }
    /* Сетка товаров */
    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #282828;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-img {
      width: 100%;
      height: 130px;
      background: #252525;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .price {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
    }
    .add-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    /* Нижнее меню */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #181818;
      border-top: 1px solid #282828;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #888;
      font-size: 11px;
      text-decoration: none;
    }
    .nav-item.active {
      color: #3b82f6;
    }
    .nav-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Баннер -->
  <div class="banner">
    <h2>Kraken-Lab Shop</h2>
  </div>

  <!-- Категории -->
  <div class="categories">
    <button class="cat-btn active">Всі товари</button>
    <button class="cat-btn">Рідина</button>
    <button class="cat-btn">POD-Системи</button>
    <button class="cat-btn">Картриджі</button>
  </div>

  <!-- Витрина -->
  <div class="products-grid">
    <div class="card">
      <div class="card-img">Фото товара</div>
      <div class="card-title">INBOTTLE EVO 30ml 50mg</div>
      <div class="card-bottom">
        <span class="price">350.00 ₴</span>
        <button class="add-btn">🛒</button>
      </div>
    </div>

    <div class="card">
      <div class="card-img">Фото товара</div>
      <div class="card-title">HYPE HARD 30ML 70MG</div>
      <div class="card-bottom">
        <span class="price">320.00 ₴</span>
        <button class="add-btn">🛒</button>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Головна</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">⣿</span>
      <span>Каталог</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Пошук</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>Кошик</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Профіль</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>
